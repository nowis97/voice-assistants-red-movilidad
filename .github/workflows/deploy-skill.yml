name: Deploy Alexa Skill Models & Manifest

on:
  push:
    branches:
      - master
    paths:
      - 'skill-package/**'
      - 'ask-resources.json'
  workflow_dispatch:

jobs:
  deploy-skill:
    name: Deploy to Alexa Developer Console
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install ASK CLI
        run: npm install -g ask-cli

      - name: Configure ASK CLI Credentials
        env:
          ASK_REFRESH_TOKEN: ${{ secrets.ASK_REFRESH_TOKEN }}
          ASK_VENDOR_ID: ${{ secrets.ASK_VENDOR_ID }}
        run: |
          mkdir -p ~/.ask
          cat << EOF > ~/.ask/cli_config
          {
            "profiles": {
              "default": {
                "token": {
                  "refresh_token": "$ASK_REFRESH_TOKEN"
                },
                "vendor_id": "$ASK_VENDOR_ID"
              }
            }
          }
          EOF

      - name: Deploy Skill Metadata (Models & Manifest)
        run: |
          ask deploy --target skill-metadata --ignore-hash
