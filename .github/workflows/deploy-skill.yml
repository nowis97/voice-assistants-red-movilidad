name: Deploy Alexa Skill Models & Manifest

on:
  push:
    branches:
      - master
    paths:
      - 'skill-package/**'
      - 'ask-resources.json'
  workflow_dispatch:

jobs:
  deploy-skill:
    name: Deploy to Alexa Developer Console
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install ASK CLI
        run: npm install -g ask-cli

      - name: Configure ASK CLI Credentials
        env:
          ASK_REFRESH_TOKEN: ${{ secrets.ASK_REFRESH_TOKEN }}
          ASK_VENDOR_ID: ${{ secrets.ASK_VENDOR_ID }}
        run: |
          node -e '
          const fs = require("fs");
          const os = require("os");
          const path = require("path");
          const execSync = require("child_process").execSync;

          const npmRoot = execSync("npm root -g").toString().trim();
          const LWAClient = require(path.join(npmRoot, "ask-cli/dist/lib/clients/lwa-auth-code-client"));
          const client = new LWAClient({});

          const refreshToken = process.env.ASK_REFRESH_TOKEN;
          const vendorId = process.env.ASK_VENDOR_ID;

          client.refreshToken({ refresh_token: refreshToken }, (err, token) => {
            if (err) {
              console.error("Failed to refresh token:", err);
              process.exit(1);
            }
            const askDir = path.join(os.homedir(), ".ask");
            if (!fs.existsSync(askDir)) {
              fs.mkdirSync(askDir, { recursive: true });
            }
            const config = {
              profiles: {
                default: {
                  token: token,
                  vendor_id: vendorId
                }
              }
            };
            fs.writeFileSync(path.join(askDir, "cli_config"), JSON.stringify(config, null, 2));
            console.log("Configured ~/.ask/cli_config successfully with fresh access token.");
          });
          '

      - name: Deploy Skill Metadata (Models & Manifest)
        run: |
          ask deploy --target skill-metadata --ignore-hash
